name: Prompt Lessons launch integrity
on:
  pull_request:
    paths:
      - 'tester/prompt-lessons/**'
      - 'tests/prompt-lessons-integrity.test.mjs'
      - '.github/workflows/prompt-lessons-integrity.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/prompt-lessons-integrity.test.mjs
