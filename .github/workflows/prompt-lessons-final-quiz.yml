name: Prompt Lessons final quiz (development)
on:
  pull_request:
    paths:
      - 'tester/prompt-lessons/**'
      - 'tests/prompt-lessons-final-quiz.test.mjs'
      - '.github/workflows/prompt-lessons-final-quiz.yml'
permissions:
  contents: read
jobs:
  quiz-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/prompt-lessons-final-quiz.test.mjs
